name: Update Animated Streak Fireball

on:
  schedule:
    - cron: "0 */6 * * *" # Runs every 6 hours
  push:
    branches: [main]
  workflow_dispatch: # Allows manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  build-streak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate animated streak SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: BhuvanExpo
        run: python .github/scripts/generate_streak.py

      - name: Commit and push updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/streak.svg
          git diff --staged --quiet || git commit -m "chore: update animated streak fireball"
          git push
